services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiujitsugym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jiujitsugym"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Exposed so the app can be run from Visual Studio / `dotnet run`
      # against this database during development. Safe to remove on the Pi.
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=jiujitsugym;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
    volumes:
      # Persist Data Protection keys so auth cookies and antiforgery tokens
      # survive a redeploy. Without this the container generates a new key
      # ring on every recreate and logs everyone out.
      - dpkeys:/root/.aspnet/DataProtection-Keys
    ports:
      - "8080:8080"

volumes:
  pgdata:
  dpkeys:

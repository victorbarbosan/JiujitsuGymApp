# Local development only. Production lives in the private infra repo at
# jiujitsugymapp/docker-compose.yml and is applied by its pipeline, so
# editing this file has no effect on the Pi.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiujitsugym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jiujitsugym"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=jiujitsugym;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      # First administrator, created on startup when no account holds this
      # address yet. Leaving these set across redeploys is safe: an existing
      # account is never re-created and never re-passworded, so a password
      # changed in the app is not reverted on the next restart. Leave the
      # password empty and the bootstrap is skipped entirely.
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@nexusbjj.local}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      # Persist Data Protection keys so auth cookies and antiforgery tokens
      # survive a redeploy. Without this the container generates a new key
      # ring on every recreate and logs everyone out.
      - dpkeys:/root/.aspnet/DataProtection-Keys

volumes:
  pgdata:
  dpkeys:

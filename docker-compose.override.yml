# Development-only port bindings. docker compose loads this file
# automatically next to docker-compose.yml. The Pi never sees either file -
# it deploys from the infra repo's own compose, which publishes nothing on
# the host because nginx reaches the app over the shared `web` network.
services:
  db:
    ports:
      # Lets Visual Studio / `dotnet run` reach the containerised database
      - "5432:5432"
  app:
    ports:
      - "8080:8080"

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run unit tests
        run: dotnet test JiujitsuGymApp.Tests --configuration Release

  # Build the production image natively on GitHub's free arm64 runners
  # (public repo) and publish it to Docker Hub. Watchtower on the Pi picks
  # the new :latest up and recreates the app container - no runner, webhook
  # or SSH access to the Pi involved. The commit-sha tag is kept for
  # rollbacks (docker compose can pin it if :latest is ever bad).
  publish-image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            victorbarbosa9/jiujitsugymapp:latest
            victorbarbosa9/jiujitsugymapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
